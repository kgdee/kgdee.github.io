<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kgdee - GitHub</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="vendor/bootstrap-icons-1.13.2/bootstrap-icons.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/utils.css" />
    <link rel="stylesheet" href="css/main.css" />
    <script src="vendor/firebasejs-10.10.0/firebase-app-compat.js" defer></script>
    <script src="vendor/firebasejs-10.10.0/firebase-auth-compat.js" defer></script>
    <script src="vendor/firebasejs-10.10.0/firebase-firestore-compat.js" defer></script>
    <script src="js/constants.js" defer></script>
    <script src="js/utils.js" defer></script>
    <script src="js/db.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/search-bar.js" defer></script>
    <script src="js/toast.js" defer></script>
  </head>
  <body class="dark-theme">
    <div class="app container">
      <header class="navbar">
        <div class="logo">Kgdee.</div>

        <button class="search-btn" onclick="SearchBar.toggle()">
          <i class="bi bi-search"></i>
        </button>

        <div class="search-bar hidden">
          <button class="exit" onclick="SearchBar.toggle()">
            <i class="bi bi-arrow-left"></i>
          </button>
          <label class="search-box">
            <input type="text" oninput="SearchBar.search(event.target.value)" placeholder="Type to search..." />
          </label>
          <button onclick="SearchBar.clear()" class="clear-btn">
            <i class="bi bi-search"></i>
          </button>
        </div>
      </header>

      <main>
        <div class="items-grid">
          <div class="msg">Loading items...</div>
        </div>
      </main>

      <div class="toast hidden"></div>
    </div>
  </body>
</html>
